{% load i18n %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="/">{{ SITE_NAME }}</a>

    <div class="collapse navbar-collapse">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="/accounts/login/">
            <i class="fas fa-sign-in-alt me-1"></i> {% trans "Login" %}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/accounts/signup/">
            <i class="fas fa-user-plus me-1"></i> {% trans "Register" %}
          </a>
        </li>

      </ul>

      <form action="{% url 'set_language' %}" method="post" class="ms-3">
        {% csrf_token %}

        {% get_current_language as LANGUAGE_CODE %}
        {% get_available_languages as LANGUAGES %}

        <select
          name="language"
          class="form-select form-select-sm bg-dark text-light border-secondary"
          onchange="this.form.submit()"
          style="width: auto;"
        >
          {% for lang in LANGUAGES %}
            <option value="{{ lang.0 }}"
              {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
              {{ lang.1 }}
            </option>
          {% endfor %}
        </select>

      </form>

    </div>
  </div>
</nav>
